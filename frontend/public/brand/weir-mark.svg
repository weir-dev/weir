<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WEIR Logo">
  <!-- Background Riverbed -->
  <rect width="64" height="64" rx="14" fill="#10211F"/>
  
  <!-- Water line -->
  <path d="M6 48 C 16 46, 24 50, 34 48 C 44 46, 52 50, 58 48" fill="none" stroke="#5E8C7E" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Three Weir Stakes (Mist) -->
  <rect x="18" y="24" width="4" height="26" rx="2" fill="#EEF1EA"/>
  <rect x="30" y="20" width="4" height="30" rx="2" fill="#EEF1EA"/>
  <rect x="42" y="26" width="4" height="24" rx="2" fill="#EEF1EA"/>
  
  <!-- Kip Salmon Leaping (Coral #FC6423) -->
  <!-- Tail, Body arching up, head with kype hooked jaw -->
  <path d="M12 40 C 16 34, 22 24, 32 18 C 39 14, 48 15, 52 20 C 53 22, 51 24, 48 24 C 44 24, 38 22, 32 25 C 26 28, 20 36, 16 42 Z" fill="#FC6423"/>
  <!-- Salmon tail fin -->
  <polygon points="10,43 15,39 12,35" fill="#FC6423"/>
  <!-- Dorsal fin -->
  <path d="M30 19 L35 14 L37 18 Z" fill="#FC6423"/>
  <!-- Pectoral fin -->
  <path d="M42 22 L40 26 L44 25 Z" fill="#FC6423"/>
  <!-- Eye -->
  <circle cx="48" cy="19" r="1.2" fill="#10211F"/>
</svg>
