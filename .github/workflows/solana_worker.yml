name: WEIR Solana Ingest & ML Worker 24/7

on:
  schedule:
    # Runs automatically every 15 minutes (24/7 nonstop in GitHub Cloud)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-solana-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute WEIR Ingest & ML Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          SOLANA_RPC_URL: "https://api.mainnet-beta.solana.com"
          DEXSCREENER_API_BASE: "https://api.dexscreener.com/latest/dex"
          INGEST_WORKER_ENABLED: "true"
          MODEL_WORKER_ENABLED: "true"
        run: |
          python backend/scripts/run_cron_worker.py
